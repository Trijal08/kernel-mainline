%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wwan/samsung,s5xxx-modem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos s5300/s5400 Modem (PCIe)

maintainers:
  - Steffen Deusch <steffen@deusch.me>

description: >
  Discrete Samsung Exynos modem companion chip attached over PCIe, as found on
  Google Tensor boards: the s5300 (e.g. tegu) and the s5400 (e.g. komodo).
  The AP stages the first-stage CP bootloader in a DRAM carveout, publishes it
  through a second carveout that doubles as the PCIe MSI target, and completes
  a shared-memory command handshake.

  The modem is a PCI endpoint, so its node goes under the root port it sits
  behind, per pci-bus.yaml. The driver binds to the enumerated device and the
  PCI core attaches this node to it.

properties:
  compatible:
    enum:
      - samsung,s5300-modem
      - samsung,s5400-modem

  reg:
    maxItems: 1

  memory-region:
    minItems: 2
    items:
      - description: IPC shared-memory carveout (boot image staging, command
          words and message queues)
      - description: MSI carveout the CP reports boot progress into
      - description: PKTPROC carveout the CP DMAs downlink packets into

  memory-region-names:
    minItems: 2
    items:
      - const: ipc
      - const: msi
      - const: pktproc

  firmware-name:
    maxItems: 1
    description: First-stage CP bootloader (the BOOT entry of the vendor
      modem image TOC).

  resets:
    items:
      - description: The PCIe link. The CP bootloader drops the link part way
          through its boot and re-requests it over CP2AP_WAKEUP, so asserting
          and deasserting are driven separately with a wait in between.
      - description: Cold power cycle of the CP, so a crashed or self-reset
          baseband is back in its boot ROM.
      - description: Warm reset of the CP with its dump-notify line latched, so
          it comes back running its minidump agent.

  reset-names:
    items:
      - const: link
      - const: cp-cold
      - const: cp-dump

  cp2ap-wakeup-gpios:
    maxItems: 1
    description: CP-driven line signalling the CP is awake / ready to
      re-link.

  cp2ap-active-gpios:
    maxItems: 1
    description: CP2AP_PHONE_ACTIVE; high while the CP runs, a falling edge
      after ONLINE indicates a CP crash.  Optional (crash diagnosis).

  cp-partial-rst-gpios:
    maxItems: 1
    description: AP2CP_PARTIAL_RST_N; the AP holds this active-low line high
      (deasserted) or MAIN samples it as a partial-reset request and
      self-resets after ONLINE.  Optional.

required:
  - compatible
  - memory-region
  - memory-region-names
  - reg
  - resets
  - reset-names
  - cp2ap-wakeup-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/reset/google,zuma-pcie.h>

    pcie0: pcie {
        #address-cells = <3>;
        #size-cells = <2>;
        device_type = "pci";
        ranges;
        #reset-cells = <1>;

        pcie@0,0 {
            reg = <0x0 0x0 0x0 0x0 0x0>;
            #address-cells = <3>;
            #size-cells = <2>;
            device_type = "pci";
            ranges;

            modem@0,0 {
                compatible = "samsung,s5400-modem";
                reg = <0x0 0x0 0x0 0x0 0x0>;
                memory-region = <&cp_rmem>, <&cp_msi_rmem>;
                memory-region-names = "ipc", "msi";
                firmware-name = "tegu/cp_pbl.bin";
                resets = <&pcie0 ZUMA_PCIE_RESET_LINK>,
                         <&pcie0 ZUMA_PCIE_RESET_CP_COLD>,
                         <&pcie0 ZUMA_PCIE_RESET_CP_DUMP>;
                reset-names = "link", "cp-cold", "cp-dump";
                cp2ap-wakeup-gpios = <&gpa5 1 GPIO_ACTIVE_HIGH>;
            };
        };
    };
