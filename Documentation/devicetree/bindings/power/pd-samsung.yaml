%YAML 1.2
---
$id: http://devicetree.org/schemas/power/pd-samsung.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos SoC Power Domains

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description: |+
  Exynos processors include support for multiple power domains which are used
  to gate power to one or more peripherals on the processor.

allOf:
  - $ref: power-domain.yaml#
  - if:
      properties:
        compatible:
          const: google,zumapro-pd
    then:
      properties:
        reg-names:
          minItems: 1
    else:
      properties:
        reg:
          maxItems: 1
        reg-names: false
        samsung,always-on: false
        samsung,secure-pd-id: false

properties:
  compatible:
    enum:
      - google,zumapro-pd
      - samsung,exynos4210-pd
      - samsung,exynos5433-pd

  reg:
    minItems: 1
    items:
      - description: The domain's configuration and status registers in the PMU
      - description: |
          The register block of the clock controller (CMU) inside the domain.
          The power sequence writes its controller option before the domain
          goes down and, for a domain whose CMU has no clock provider, saves
          and restores its clock state around the transition.
      - description: |
          The register block of the system registers (SYSREG) inside the
          domain, saved and restored with the CMU.

  reg-names:
    minItems: 1
    items:
      - const: pmu
      - const: cmu
      - const: sysreg

  clocks:
    deprecated: true
    maxItems: 1

  clock-names:
    deprecated: true
    maxItems: 1

  label:
    description:
      Human readable string with domain name. Will be visible in userspace
      to let user to distinguish between multiple domains in SoC.

  "#power-domain-cells":
    const: 0

  power-domains:
    maxItems: 1

  samsung,always-on:
    type: boolean
    description:
      Keep the domain powered while Linux lacks complete save/restore
      sequencing for the domain.

  samsung,secure-pd-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Secure monitor power-domain identifier used by Tensor-class Exynos
      firmware before power-down and after power-up.

required:
  - compatible
  - "#power-domain-cells"
  - reg

unevaluatedProperties: false

examples:
  - |
    lcd0_pd: power-domain@10023c80 {
        compatible = "samsung,exynos4210-pd";
        reg = <0x10023c80 0x20>;
        #power-domain-cells = <0>;
        label = "LCD0";
    };

    mfc_pd: power-domain@10044060 {
        compatible = "samsung,exynos4210-pd";
        reg = <0x10044060 0x20>;
        #power-domain-cells = <0>;
        label = "MFC";
    };

  - |
    display_pd: power-domain@15461d00 {
        compatible = "google,zumapro-pd";
        reg = <0x15461d00 0x20>, <0x19400000 0x10000>;
        reg-names = "pmu", "cmu";
        samsung,secure-pd-id = <0x19410204>;
        samsung,always-on;
        #power-domain-cells = <0>;
        label = "DPUB";
    };
