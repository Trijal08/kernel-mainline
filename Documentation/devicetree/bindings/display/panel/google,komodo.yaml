%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/google,komodo.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Komodo (Pixel 9 Pro XL) MIPI-DSI panel

maintainers:
  - Trijal Saha <trijalsaha2012@gmail.com>

description:
  The komodo (Pixel 9 Pro XL, google,gs-km4) panel is a 1344x2992 command-mode
  LTPO OLED driven over 4-lane MIPI-DSI with dual DSC. The bootloader powers
  and lights the panel; this binding describes the boot-handoff use where the
  driver adopts the running link, so no power supplies or reset GPIO are
  described.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: google,komodo-panel

  reg:
    maxItems: 1
    description: DSI virtual channel

  reset-gpios:
    maxItems: 1
    description:
      DDIC reset line, used for a cold power-on. Not required on a board that
      only ever adopts a bootloader-lit panel (boot handover).

  port: true

required:
  - compatible
  - reg
  - port

unevaluatedProperties: false

examples:
  - |
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "google,komodo-panel";
            reg = <0>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsim0_out>;
                };
            };
        };
    };
