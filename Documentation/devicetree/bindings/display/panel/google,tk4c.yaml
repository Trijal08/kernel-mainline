%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/google,tk4c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google TK4C MIPI-DSI panel

maintainers:
  - Trijal Saha <trijalsaha2012@gmail.com>

description:
  The TK4C is one of the 1080x2424 command-mode LTPO OLED panels used by
  Google Pixel 9 (tokay). It uses four MIPI-DSI lanes and dual DSC.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: google,gs-tk4c

  reg:
    maxItems: 1
    description: DSI virtual channel

  reset-gpios:
    maxItems: 1

  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "google,gs-tk4c";
            reg = <0>;
            reset-gpios = <&gpp0 0 0>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsim0_out>;
                };
            };
        };
    };
